services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Storque
      POSTGRES_USER: Storque
      POSTGRES_PASSWORD: Storque_dev_password
    ports: ["5432:5432"]
    volumes:
      - Storque_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Storque -d Storque"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: postgres://Storque:Storque_dev_password@db:5432/Storque
      JWT_SECRET: replace-this-secret-before-deployment
      CORS_ORIGIN: "*"
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  Storque_data:
